[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cce_server"]

[project]
name = "ichnos-cce"
version = "0.1.0"
description = "Cross-Channel Context Engine — operator context over MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "respx>=0.20",
    "ruff>=0.4",
    "asgi-lifespan>=2.0",
]

[project.scripts]
ichnos-cce = "cce_server.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=cce_server --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
